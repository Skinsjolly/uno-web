<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO — Web</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎴</text></svg>">
</head>
<body>
<div id="app">
  <header>
    <h1>UNO <span class="sub">web</span></h1>
    <div id="topbar"></div>
  </header>

  <section id="screen-auth" class="screen">
    <form id="auth-form" class="card panel">
      <h2 id="auth-title">Log in</h2>
      <label>Username
        <input id="auth-username" name="username" autocomplete="username" maxlength="20" required>
      </label>
      <label>Password
        <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <div class="row">
        <button type="submit" id="auth-submit" class="primary">Log in</button>
        <button type="button" id="auth-toggle" class="ghost">Sign up instead</button>
      </div>
      <p id="auth-error" class="error"></p>
    </form>
  </section>

  <section id="screen-lobby" class="screen hidden">
    <div class="lobby-layout">
      <div class="card panel">
        <h2>Lobby</h2>
        <p id="lobby-status">Waiting for players…</p>
        <ul id="lobby-players"></ul>
        <div class="row" id="lobby-host-bar">
          <label>Players (2–8)
            <select id="lobby-capacity"></select>
          </label>
          <button type="button" id="lobby-start" class="primary">Start game</button>
        </div>
        <button type="button" id="lobby-leave" class="danger">Leave lobby</button>
      </div>
      <div class="card panel">
        <h2>Join a game</h2>
        <p class="muted">Your code: <strong id="lobby-code"></strong><br>Share it so friends can join with the 6-character code.</p>
        <div class="row">
          <input id="lobby-join-code" maxlength="6" placeholder="ABC123">
          <button type="button" id="lobby-join" class="primary">Join</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <div id="game">
      <div id="opponents"></div>
      <div id="table">
        <div id="piles">
          <div class="pile" id="pile-deck">
            <div class="card back"><div class="card-face">UNO</div></div>
            <span id="deck-count" class="count"></span>
          </div>
          <div id="discard-wrap">
            <div class="card back" id="discard-placeholder"><div class="card-face"></div></div>
          </div>
        </div>
        <div id="meta">
          <div id="color-badge">🎨 <span id="current-color"></span></div>
          <div id="direction">➡️</div>
          <div id="turn-banner">—</div>
          <div id="deadline" class="muted"></div>
        </div>
      </div>
      <div id="me">
        <div id="me-header">
          <span id="me-name"></span>
          <span id="me-score" class="muted"></span>
          <button type="button" id="btn-uno" class="warn hidden">UNO!</button>
          <button type="button" id="btn-draw" class="primary">Draw</button>
        </div>
        <div id="hand"></div>
      </div>
      <div id="scorers" class="hidden">
        <h3>Results</h3>
        <ul id="results"></ul>
        <div class="row">
          <button type="button" id="btn-next-round" class="primary hidden">Next round</button>
          <button type="button" id="btn-lobby" class="ghost">Back to lobby</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="modal" class="hidden">
  <div id="modal-inner"></div>
</div>
<div id="toasts"></div>

<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
